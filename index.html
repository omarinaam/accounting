<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إحصائيات الصندوق · كلية علوم الحاسوب والرياضيات</title>
<meta name="description" content="إحصائيات شعبة الحسابات · الصندوق — أرقام مجمّعة تُحدَّث يومياً">
<link rel="icon" href="logo.jpg">
<style>
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(fonts/cairo-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(fonts/cairo-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:600;font-display:swap;src:url(fonts/cairo-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:600;font-display:swap;src:url(fonts/cairo-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:700;font-display:swap;src:url(fonts/cairo-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:700;font-display:swap;src:url(fonts/cairo-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}

:root{
  --ink:#1e1b4b; --ink-2:#3f3d6b; --muted:#6b6f93; --line:rgba(79,70,229,.12);
  --indigo:#4338ca; --indigo-2:#6366f1; --teal:#0891b2; --teal-soft:#cffafe;
  --amber:#f59e0b; --ok:#047857; --warn:#c2410c; --bad:#b91c1c;
  --panel:rgba(255,255,255,.72); --panel-solid:#fff;
  --bg:#eef0fb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1100px 600px at 100% -10%,#c7d2fe 0,transparent 60%),
                   radial-gradient(900px 600px at -10% 10%,#a5f3fc 0,transparent 55%),
                   radial-gradient(800px 700px at 50% 120%,#e9d5ff 0,transparent 60%);
  background-attachment:fixed;line-height:1.6;font-size:16px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 48px}

/* ---- الرأس */
header.top{background:linear-gradient(135deg,#312e81 0%,#3730a3 45%,#0e7490 100%);color:#fff;
  padding:28px 0 92px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -10% -60% -10%;height:120%;
  background:radial-gradient(closest-side,rgba(34,211,238,.35),transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.brand img{width:64px;height:64px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.brand h1{margin:0;font-size:clamp(1.25rem,3.2vw,1.75rem);font-weight:700;line-height:1.3}
.brand p{margin:2px 0 0;opacity:.8;font-size:.95rem}
.updated{position:relative;z-index:1;margin-top:18px;display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 14px;font-size:.9rem}
.updated i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}

/* ---- البطل: مجموع السنة المالية */
.hero{margin-top:-64px;position:relative;z-index:2;background:var(--panel-solid);border-radius:22px;
  box-shadow:0 20px 50px -24px rgba(49,46,129,.45);padding:24px 26px}
.hero-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.hero-head h2{margin:0;font-size:1.05rem;color:var(--muted);font-weight:600}
.years{display:flex;gap:6px;flex-wrap:wrap}
.years button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:#f5f6ff;color:var(--ink-2);
  border-radius:999px;padding:3px 14px;cursor:pointer}
.years button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.years button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.big b{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:700;letter-spacing:-.5px;color:var(--ink);line-height:1.1}
.big span{color:var(--muted);font-size:1.05rem}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:16px;border-top:1px solid var(--line)}
.split div{padding:14px 4px 0 14px}
.split div+div{border-right:1px solid var(--line);padding-right:16px}
.split small{display:block;color:var(--muted);font-size:.85rem}
.split strong{font-size:1.3rem;font-weight:700}
.split em{font-style:normal;color:var(--muted);font-size:.85rem;display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:middle}

/* ---- الأقسام */
section.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:20px 22px;margin-top:18px;
  box-shadow:0 10px 30px -22px rgba(49,46,129,.35)}
.panel h3{margin:0;font-size:1.15rem;font-weight:700}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>section.panel{margin-top:0}
.row{margin-top:18px}

/* ---- اليوم */
.today{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:12px;align-items:center}
.today .when{font-weight:700;color:var(--indigo)}
.today .when small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.today .t{background:#fff;border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.today .t small{color:var(--muted);font-size:.82rem;display:block}
.today .t b{font-size:1.2rem}

/* ---- مخطط الأشهر */
.bars{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:10px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bar .stack{display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;min-height:2px;background:#e5e7f5}
.bar .seg-t{background:linear-gradient(180deg,#6366f1,#4338ca)}
.bar .seg-m{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.bar .v{font-size:.74rem;color:var(--ink-2);text-align:center;margin-bottom:3px;white-space:nowrap;font-weight:700;line-height:1.15}
.bar .v small{display:block;font-size:.66rem;font-weight:400;color:var(--muted)}
.bar.future .stack{background:repeating-linear-gradient(45deg,#eef0fb,#eef0fb 4px,#e3e6f7 4px,#e3e6f7 8px)}
.bar:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;border-radius:6px}
.mlabels{display:flex;gap:6px;margin-top:6px}
.mlabels span{flex:1;text-align:center;font-size:.72rem;color:var(--muted);min-width:0;line-height:1.3}
.mlabels i{font-style:normal}.mlabels .mn{display:none}
.legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2);margin-bottom:6px}
.tip{position:fixed;pointer-events:none;background:#1e1b4b;color:#fff;border-radius:10px;padding:8px 12px;font-size:.85rem;
  line-height:1.5;opacity:0;transition:opacity .12s;z-index:20;max-width:240px}
.tip.on{opacity:1}

/* ---- الدائرة والقوائم */
.donut-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:180px;height:180px;flex:none}
.donut text{font-family:Cairo,sans-serif}
.list{list-style:none;margin:0;padding:0;flex:1;min-width:200px}
.list li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.list li:last-child{border-bottom:0}
.list li b{font-weight:700;white-space:nowrap}
.list li .pc{color:var(--muted);font-size:.8rem;margin-right:6px;font-weight:400}
.hbars li{grid-template-columns:1fr auto}
.list.st li{grid-template-columns:12px 1fr auto}
.list .pc{min-width:46px;text-align:left}
.hbar{grid-column:1 / -1;height:6px;border-radius:4px;background:#eef0fb;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:4px}

/* ---- السنة الدراسية */
.rate{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.gauge{width:150px;height:150px;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;flex:1}
.facts div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.facts small{display:block;color:var(--muted);font-size:.82rem}
.facts b{font-size:1.15rem}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.93rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.n,th.n{text-align:left;white-space:nowrap}
.table-scroll{overflow-x:auto}
.mini{height:6px;border-radius:4px;background:#eef0fb;overflow:hidden;margin-top:4px;min-width:60px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#0891b2,#22d3ee)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem}

/* ---- آخر 30 يوماً */
.days{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line)}
.days .bar .stack{border-radius:4px 4px 1px 1px}
.dlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:4px}

footer{color:var(--muted);text-align:center;font-size:.85rem;margin-top:28px}
.state{padding:60px 20px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .mlabels span{font-size:.62rem}
  .grid2{grid-template-columns:1fr}
  .today{grid-template-columns:1fr 1fr}
  .today .when{grid-column:1 / -1}
  .bar .v{display:none}
}
@media (max-width:560px){
  .split{grid-template-columns:1fr}
  .split div+div{border-right:0;border-top:1px solid var(--line);padding-right:4px;margin-top:10px}
  .hero{padding:20px 18px}
  section.panel{padding:18px 16px}
  .mlabels .ml{display:none}.mlabels .mn{display:inline}
  .facts{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <img src="logo.jpg" alt="شعار الكلية" onerror="this.style.display='none'">
      <div>
        <h1 id="college">كلية علوم الحاسوب والرياضيات</h1>
        <p id="unit">شعبة الحسابات · الصندوق — إحصائيات تُحدَّث يومياً</p>
      </div>
    </div>
    <div class="updated" id="updated" hidden><i aria-hidden="true"></i><span></span></div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="hero state" id="loading">جارٍ تحميل الإحصائيات…</div>
</main>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var TYPE_COLORS=["#06b6d4","#6366f1","#a855f7","#ec4899","#14b8a6","#84cc16"];
var MISC_COLOR="#f59e0b";
var DEGREES={bachelor:"بكالوريوس",diploma:"دبلوم عالي",master:"ماجستير",phd:"دكتوراه"};
var STATUS_COLORS={"بريء الذمة":"#10b981","مسدد جزئياً":"#f59e0b","مطلوب":"#ef4444","يطالب":"#6366f1"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString("en-US")}
function short(n){
  n=n||0;
  if(n>=1e9) return {v:(n/1e9).toFixed(2).replace(/\.?0+$/,""),u:"مليار"};
  if(n>=1e6) return {v:(n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,""),u:"مليون"};
  if(n>=1e3) return {v:Math.round(n/1e3).toLocaleString("en-US"),u:"ألف"};
  return {v:fmt(n),u:""};
}
function shortTxt(n){var s=short(n);return s.v+(s.u?" "+s.u:"")}
function dateAr(iso){var d=new Date(iso+"T00:00:00");return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}
function dm(iso){var d=new Date(iso+"T00:00:00");return d.getDate()+" "+MONTHS[d.getMonth()]}
function pct(a,b){return b?Math.round(a*1000/b)/10:0}
function pc(a,b){return "<bdi>"+pct(a,b)+"%</bdi>"}

function donut(items,center,sub){
  var total=items.reduce(function(s,i){return s+i.value},0),r=70,C=2*Math.PI*r,off=0,segs="";
  items.forEach(function(i){
    if(!i.value) return;
    var len=C*i.value/total;
    segs+='<circle r="'+r+'" cx="90" cy="90" fill="none" stroke="'+i.color+'" stroke-width="26" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)"><title>'+esc(i.name)+": "+fmt(i.value)+'</title></circle>';
    off+=len;
  });
  if(!total) segs='<circle r="'+r+'" cx="90" cy="90" fill="none" stroke="#e5e7f5" stroke-width="26"/>';
  return '<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="'+esc(sub)+'">'+segs+
    '<text x="90" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1b4b">'+esc(center)+'</text>'+
    '<text x="90" y="114" text-anchor="middle" font-size="13" fill="#6b6f93">'+esc(sub)+'</text></svg>';
}
function gauge(rate){
  var r=62,C=2*Math.PI*r,len=C*Math.min(rate,100)/100;
  return '<svg class="gauge" viewBox="0 0 150 150" role="img" aria-label="نسبة التحصيل '+rate+'%">'+
    '<circle r="'+r+'" cx="75" cy="75" fill="none" stroke="#e5e7f5" stroke-width="14"/>'+
    '<circle r="'+r+'" cx="75" cy="75" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+len+' '+(C-len)+'" transform="rotate(-90 75 75)"/>'+
    '<defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>'+
    '<text x="75" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#1e1b4b">'+rate+'%</text>'+
    '<text x="75" y="102" text-anchor="middle" font-size="12" fill="#6b6f93">نسبة التحصيل</text></svg>';
}

var tip=document.getElementById("tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(function(el){
    function show(e){tip.innerHTML=el.getAttribute("data-tip");tip.classList.add("on");move(e)}
    function move(e){
      var x,y;
      if(e&&e.clientX!=null){x=e.clientX;y=e.clientY}else{var b=el.getBoundingClientRect();x=b.left+b.width/2;y=b.top}
      tip.style.left=Math.min(Math.max(8,x-tip.offsetWidth/2),innerWidth-tip.offsetWidth-8)+"px";
      tip.style.top=Math.max(8,y-tip.offsetHeight-12)+"px";
    }
    el.addEventListener("mouseenter",show);el.addEventListener("mousemove",move);
    el.addEventListener("mouseleave",function(){tip.classList.remove("on")});
    el.addEventListener("focus",show);el.addEventListener("blur",function(){tip.classList.remove("on")});
  });
}

var S,year;
function render(){
  var F=S.fiscal[year],total=F.tuition+F.misc,now=new Date(S.generated_at);
  var isCur=+year===now.getFullYear();
  var h="";

  // ---- البطل
  var yb=Object.keys(S.fiscal).sort().reverse().map(function(y){
    return '<button type="button" data-y="'+y+'" aria-pressed="'+(y===year)+'">'+y+'</button>'}).join("");
  h+='<section class="hero" aria-labelledby="h-total"><div class="hero-head"><h2 id="h-total">مجموع المقبوض في الصندوق — السنة المالية '+year+
     ' (1/1 إلى 31/12)</h2><div class="years" role="group" aria-label="اختر السنة المالية">'+yb+'</div></div>'+
     '<div class="big"><b>'+fmt(total)+'</b><span>دينار عراقي</span></div>'+
     '<div class="split">'+
       '<div><small><span class="dot" style="background:#4f46e5"></span>أقساط الطلبة</small><strong>'+fmt(F.tuition)+'</strong><em>'+fmt(F.tuition_n)+' وصلاً · '+pc(F.tuition,total)+'</em></div>'+
       '<div><small><span class="dot" style="background:'+MISC_COLOR+'"></span>الوصولات المتنوعة</small><strong>'+fmt(F.misc)+'</strong><em>'+fmt(F.misc_n)+' وصلاً · '+pc(F.misc,total)+'</em></div>'+
       '<div><small>عدد الوصولات</small><strong>'+fmt(F.tuition_n+F.misc_n)+'</strong><em>'+(F.refunds?"مبالغ أُرجعت للطلبة: "+fmt(F.refunds):"منذ 1/1/"+year)+'</em></div>'+
     '</div></section>';

  // ---- اليوم
  if(isCur){
    var T=S.today;
    h+='<section class="panel today" aria-label="مقبوض اليوم"><div class="when">مقبوض اليوم<small>'+dateAr(T.date)+'</small></div>'+
       '<div class="t"><small>أقساط الطلبة</small><b>'+fmt(T.tuition)+'</b> <small>'+T.tuition_n+' وصلاً</small></div>'+
       '<div class="t"><small>الوصولات المتنوعة</small><b>'+fmt(T.misc)+'</b> <small>'+T.misc_n+' وصلاً</small></div>'+
       '<div class="t"><small>المجموع</small><b>'+fmt(T.tuition+T.misc)+'</b> <small>دينار</small></div></section>';
  }

  // ---- الأشهر
  var max=Math.max.apply(null,F.months.map(function(m){return m.tuition+m.misc}).concat([1]));
  var bars="",labels="";
  F.months.forEach(function(m,i){
    var t=m.tuition+m.misc,fut=isCur&&i>now.getMonth();
    var tipHtml="<b>"+MONTHS[i]+" "+year+"</b><br>الأقساط: "+fmt(m.tuition)+"<br>المتنوعة: "+fmt(m.misc)+"<br>المجموع: "+fmt(t);
    bars+='<div class="bar'+(fut?" future":"")+'" tabindex="0" data-tip="'+esc(tipHtml)+'" aria-label="'+esc(MONTHS[i]+": "+fmt(t)+" دينار")+'">'+
          (t?'<div class="v">'+short(t).v+'<small>'+short(t).u+'</small></div>':"")+
          '<div class="stack" style="height:'+(fut?8:Math.max(t/max*100,t?2:1))+'%">'+
          (t?'<div class="seg-t" style="flex:'+m.tuition+'"></div><div class="seg-m" style="flex:'+m.misc+'"></div>':"")+'</div></div>';
    labels+='<span title="'+MONTHS[i]+'"><i class="ml">'+MONTHS[i]+'</i><i class="mn">'+(i+1)+'</i></span>';
  });
  h+='<section class="panel row" aria-labelledby="h-months"><h3 id="h-months">المقبوض شهرياً</h3><p class="sub">بالدينار، السنة المالية '+year+'. مرّر المؤشر على العمود لرؤية التفاصيل.</p>'+
     '<div class="legend-inline"><span><span class="dot" style="background:#4f46e5"></span>أقساط الطلبة</span><span><span class="dot" style="background:'+MISC_COLOR+'"></span>الوصولات المتنوعة</span></div>'+
     '<div class="bars">'+bars+'</div><div class="mlabels">'+labels+'</div></section>';

  // ---- حسب النوع + المتنوعة
  var items=F.by_type.map(function(r,i){return{name:r.name,value:r.value,color:TYPE_COLORS[i%TYPE_COLORS.length]}});
  if(F.misc) items.push({name:"وصولات متنوعة",value:F.misc,color:MISC_COLOR});
  var s=short(total);
  var li=items.filter(function(i){return i.value>0}).map(function(i){
    return '<li><span class="dot" style="background:'+i.color+'"></span><span>'+esc(i.name)+'</span><b>'+fmt(i.value)+'</b><span class="pc">'+pc(i.value,total)+'</span></li>'}).join("")||'<li><span></span><span>لا توجد وصولات بعد</span><b></b></li>';
  var mt=F.misc_types,mmax=Math.max.apply(null,mt.map(function(r){return r.value}).concat([1]));
  var mli=mt.map(function(r){
    return '<li><span>'+esc(r.name)+' <span class="pc">'+fmt(r.n)+' وصلاً</span></span><b>'+fmt(r.value)+'</b><div class="hbar"><i style="width:'+(r.value/mmax*100)+'%"></i></div></li>'}).join("")||'<li><span>لا توجد وصولات متنوعة في هذه السنة</span><b></b></li>';
  h+='<div class="grid2 row">'+
     '<section class="panel" aria-labelledby="h-types"><h3 id="h-types">المقبوض حسب النوع</h3><p class="sub">أقساط كل نوع دراسة والوصولات المتنوعة</p>'+
       '<div class="donut-box">'+donut(items,s.v,(s.u?s.u+" ":"")+"دينار")+'<ul class="list">'+li+'</ul></div></section>'+
     '<section class="panel" aria-labelledby="h-misc"><h3 id="h-misc">الوصولات المتنوعة حسب النوع</h3><p class="sub">تأييد، وثائق، هويات، أمانات وغيرها</p>'+
       '<ul class="list hbars">'+mli+'</ul></section></div>';

  // ---- السنة الدراسية
  var A=S.academic;
  if(A){
    var rows=A.by_type.filter(function(r){return r.students||r.due}).map(function(r){
      var rt=pct(r.paid,r.due);
      return '<tr><td>'+esc(r.name)+'</td><td class="n">'+fmt(r.students)+'</td><td class="n">'+fmt(r.due)+'</td><td class="n">'+fmt(r.paid)+
             '</td><td class="n">'+fmt(r.remaining)+'</td><td class="n"><bdi>'+rt+'%</bdi><div class="mini"><i style="width:'+Math.min(rt,100)+'%"></i></div></td></tr>'}).join("");
    var chips=A.status.map(function(x){return '<span><span class="dot" style="background:'+STATUS_COLORS[x.name]+'"></span>'+esc(x.name)+': <b>'+fmt(x.n)+'</b></span>'}).join("");
    h+='<section class="panel row" aria-labelledby="h-acad"><h3 id="h-acad">أقساط الطلبة — السنة الدراسية '+esc(A.label)+'</h3>'+
       '<p class="sub">الموقف المالي لأقساط هذه السنة الدراسية، بغض النظر عن تاريخ الدفع.</p>'+
       '<div class="rate">'+gauge(A.rate)+'<div class="facts">'+
         '<div><small>الطلبة المسجلون</small><b>'+fmt(A.students)+'</b></div>'+
         '<div><small>الأقساط المستحقة</small><b>'+fmt(A.due)+'</b></div>'+
         '<div><small>المسدَّد</small><b style="color:var(--ok)">'+fmt(A.paid)+'</b></div>'+
         '<div><small>المتبقي على '+fmt(A.owing)+' طالب</small><b style="color:var(--warn)">'+fmt(A.remaining)+'</b></div>'+
       '</div></div><div class="chips">'+chips+'</div>'+
       '<div class="table-scroll"><table><thead><tr><th>نوع الدراسة</th><th class="n">الطلبة</th><th class="n">المستحق</th><th class="n">المسدَّد</th><th class="n">المتبقي</th><th class="n">التحصيل</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
  }

  // ---- آخر 30 يوماً + الطلبة
  var D=S.daily,dmax=Math.max.apply(null,D.map(function(d){return d.tuition+d.misc}).concat([1]));
  var db=D.map(function(d){var t=d.tuition+d.misc;
    return '<div class="bar" tabindex="0" data-tip="'+esc("<b>"+dateAr(d.d)+"</b><br>الأقساط: "+fmt(d.tuition)+"<br>المتنوعة: "+fmt(d.misc)+"<br>المجموع: "+fmt(t))+'" aria-label="'+esc(dateAr(d.d)+": "+fmt(t))+'">'+
      '<div class="stack" style="height:'+Math.max(t/dmax*100,1)+'%">'+(t?'<div class="seg-t" style="flex:'+d.tuition+'"></div><div class="seg-m" style="flex:'+d.misc+'"></div>':"")+'</div></div>'}).join("");
  var St=S.students;
  var degs=St.by_degree.map(function(x){return '<li><span class="dot" style="background:#6366f1"></span><span>'+esc(DEGREES[x.degree]||x.degree)+'</span><b>'+fmt(x.n)+'</b></li>'}).join("");
  var typ=St.by_type.map(function(x,i){return '<li><span class="dot" style="background:'+TYPE_COLORS[i%6]+'"></span><span>'+esc(x.name)+'</span><b>'+fmt(x.n)+'</b></li>'}).join("");
  h+='<div class="grid2 row">'+
     '<section class="panel" aria-labelledby="h-days"><h3 id="h-days">آخر 30 يوماً</h3><p class="sub">المقبوض اليومي (أقساط + متنوعة)</p>'+
       '<div class="days">'+db+'</div><div class="dlabels"><span>'+dm(D[0].d)+'</span><span>'+dm(D[D.length-1].d)+'</span></div></section>'+
     '<section class="panel" aria-labelledby="h-st"><h3 id="h-st">الطلبة المستمرون</h3><p class="sub">'+fmt(St.active)+' طالباً مستمراً · '+fmt(St.graduated)+' متخرجاً</p>'+
       '<ul class="list st">'+typ+'</ul><ul class="list st" style="margin-top:10px">'+degs+'</ul></section></div>';

  h+='<footer>الأرقام مجمّعة ولا تتضمن أي بيانات شخصية للطلبة · '+esc(S.unit)+' · '+esc(S.college)+'<br>designed by OMAR INAAM</footer>';
  var app=document.getElementById("app");app.innerHTML=h;
  app.querySelectorAll(".years button").forEach(function(b){b.addEventListener("click",function(){year=b.getAttribute("data-y");render();
    try{history.replaceState(null,"","#"+year)}catch(e){}})});
  bindTips(app);
}

fetch("data/stats.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw r;return r.json()}).then(function(d){
  S=d;
  var keys=Object.keys(S.fiscal).sort().reverse(),want=(location.hash||"").slice(1);
  year=keys.indexOf(want)>=0?want:keys[0];
  if(S.college) document.getElementById("college").textContent=S.college;
  var g=new Date(S.generated_at),u=document.getElementById("updated");
  u.querySelector("span").textContent="آخر تحديث: "+dateAr(S.generated_at.slice(0,10))+" الساعة "+g.toLocaleTimeString("ar-IQ-u-nu-latn",{hour:"numeric",minute:"2-digit"});
  u.hidden=false;
  render();
}).catch(function(){
  document.getElementById("app").innerHTML='<div class="hero state">لم تُنشر الإحصائيات بعد. ستظهر هنا بعد أول نشر من برنامج شعبة الحسابات.</div>';
});
})();
</script>
</body>
</html>
